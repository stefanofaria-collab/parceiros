name: Validar migracao BigQuery

on:
  pull_request:
  push:
    branches:
      - feat/bigquery-windows-sync

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile sync/sync_from_mysql.py sync/test_mysql.py
